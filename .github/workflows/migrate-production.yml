name: Migrate production

# Applies committed migrations to the production (Neon) database.
#
# Why this is a separate, manually-triggered workflow and not part of deploy:
# a migration that runs automatically mid-deploy can be half-applied when the
# build fails, and that is the hardest state to clean up. docs/DEPLOY.md §4
# makes the same call. So this stays a deliberate, separate action — it just
# no longer requires the production connection string to leave Neon.
#
# Why a workflow at all, rather than running drizzle-kit locally: the only
# input is the production DATABASE_URL, and a database connection string is a
# credential. Stored as a repository secret it is encrypted at rest, masked in
# job output, and revocable from one screen — and it never has to be pasted
# into a chat or an issue thread to get the migration done. Same reasoning as
# deploy-bootstrap.yml.
#
# Required repository secret (Settings > Secrets and variables > Actions):
#   PRODUCTION_DATABASE_URL   the POOLED Neon string — the host contains
#                             "-pooler". See docs/DEPLOY.md §1.
#
# Run it from Actions > Migrate production > Run workflow.
#
# Safe to re-run: drizzle-kit records every applied migration in the
# __drizzle_migrations table and skips the ones already there. Running it twice
# is a no-op, not a double-apply.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "migrate" to confirm this writes to PRODUCTION'
        required: true
        default: ""
      app_url:
        description: "Deployed app URL — checks this run targets the database the app reads. Blank skips the check."
        required: false
        default: ""

# Two concurrent runs would race to apply the same migration.
concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to production
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Cheapest gate first: a mistyped confirmation should cost nothing.
      # workflow_dispatch has no native "are you sure", and this workflow is one
      # click away from the one that targets a throwaway database in CI.
      #
      # The check runs unconditionally and fails inside, rather than being an
      # `if:` on the step. With `if:`, the passing case renders as *skipped* in
      # the run summary — and a guard that reads "skipped" is indistinguishable,
      # to anyone auditing the run later, from a guard that never ran at all.
      - name: Check confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "migrate" ]; then
            echo "::error::Confirmation was '$CONFIRM', expected 'migrate'. Nothing ran."
            exit 1
          fi
          echo "Confirmed."

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A missing secret would otherwise surface as drizzle.config.ts throwing
      # "DATABASE_URL is not set", which reads like a code bug rather than a
      # setup step nobody did.
      - name: Check the secret exists
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PRODUCTION_DATABASE_URL is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          # Warn, don't fail: a non-pooled string still migrates correctly. It
          # is the serverless app that exhausts connections with one, and that
          # is a different variable in a different place (Vercel).
          case "$DATABASE_URL" in
            *-pooler*) echo "Connection string is the pooled one." ;;
            *) echo "::warning::This does not look like the pooled Neon string (no '-pooler' in the host). Fine for migrating; make sure Vercel's DATABASE_URL is the pooled one." ;;
          esac

      # Printed so the job log records what was applied, which is the audit
      # trail you want when a column turns up missing in production later.
      - name: List committed migrations
        run: ls -1 src/db/migrations/*.sql

      # The failure this catches actually happened: this workflow reported
      # success while the app still said the tables were missing, because the
      # secret here and Vercel's DATABASE_URL pointed at different databases.
      # Nothing in either log could show that — the connection strings are
      # secret and neither side prints one.
      #
      # This is a SHA-256 prefix of host + database name, with credentials
      # excluded. It reveals nothing, and comparing it to `databaseFingerprint`
      # in /api/health answers "did I migrate the database the app reads?" in
      # one glance.
      - name: Fingerprint the target database
        id: fingerprint
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          node -e '
            const { createHash } = require("node:crypto");
            const fs = require("node:fs");
            const u = new URL(process.env.DATABASE_URL);
            const fp = createHash("sha256").update(`${u.host}${u.pathname}`).digest("hex").slice(0, 12);
            console.log(`databaseFingerprint: ${fp}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `value=${fp}\n`);
          '

      # The check that would have saved a round trip. This workflow reported
      # success while the app still had no tables, because the secret and
      # Vercel's DATABASE_URL pointed at different databases — and a migration
      # applied to a database nobody reads is indistinguishable from one that
      # silently did nothing.
      #
      # Comparing fingerprints turns that into a failure with an explanation.
      # Skipped when app_url is blank, which is the honest default: before the
      # first deploy there is no app to ask.
      - name: Check this is the database the app actually reads
        if: inputs.app_url != ''
        env:
          APP_URL: ${{ inputs.app_url }}
          EXPECTED: ${{ steps.fingerprint.outputs.value }}
        run: |
          url="${APP_URL%/}/api/health"
          echo "Asking $url which database it reads..."
          body=$(curl -fsS --max-time 20 "$url") || {
            echo "::error::Could not reach $url. Check the URL, or leave app_url blank to skip this check."
            exit 1
          }

          actual=$(printf '%s' "$body" | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
              try { console.log(JSON.parse(s).databaseFingerprint ?? "") } catch { console.log("") }
            })
          ')

          if [ -z "$actual" ]; then
            echo "::warning::$url did not report a databaseFingerprint — it is probably running a build from before this field existed. Skipping the check."
            exit 0
          fi

          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::Fingerprint mismatch. This run would migrate $EXPECTED, but the app reads $actual — the migration would appear to succeed and change nothing the app can see. Point the PRODUCTION_DATABASE_URL secret at the same database as DATABASE_URL in your hosting provider, then re-run."
            exit 1
          fi

          echo "Match ($actual) — this run targets the database the app reads."

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        # The :ci variant, because there is no .env.local here.
        run: npm run db:migrate:ci
