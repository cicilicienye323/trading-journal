name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same PR cancels the previous run instead of queueing
# behind it. Keeps feedback fast and the free-tier minutes down.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate that must stay fast. No database: every unit test runs against
  # pure functions, which is a deliberate design constraint, not an omission.
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` (not `npm install`) — installs exactly the lockfile and fails
      # if package.json and the lock have drifted apart.
      - name: Install dependencies
        run: npm ci

      # Ordered cheapest-first: a formatting mistake fails in ~30s rather than
      # after the multi-minute build.
      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # No secrets are injected at build time; env validation runs for real
          # at server start instead.
          SKIP_ENV_VALIDATION: "true"

      - name: Verify committed fixtures are up to date
        run: |
          npm run fixtures
          git diff --exit-code fixtures/ \
            || (echo "::error::fixtures/ is stale — run 'npm run fixtures' and commit" && exit 1)

  # Runs in parallel with verify, so it costs no extra wall-clock.
  # A Dockerfile that is never built is a Dockerfile that has already rotted.
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fintech-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the image actually starts and serves, not just that it compiled.
      # A image that builds but crashes on boot passes a plain `docker build`.
      - name: Smoke-test the image
        run: |
          docker run -d --name app -p 3000:3000 \
            -e DATABASE_URL="postgresql://nobody:nobody@127.0.0.1:5432/none" \
            -e BETTER_AUTH_SECRET="ci-only-secret-value-at-least-32-chars-long" \
            -e BETTER_AUTH_URL="http://localhost:3000" \
            -e DEMO_EMAIL="demo@example.com" \
            fintech-app:ci
          for i in $(seq 1 30); do
            body=$(curl -s --max-time 5 http://127.0.0.1:3000/api/health || true)
            # Match on the body, not just the status code. A status-only check
            # passes against whatever else happens to hold the port, which is
            # exactly how a smoke test reports success while testing nothing.
            # 503 with this body is the expected answer here: app up, no database.
            case "$body" in
              *'"database"'*)
                echo "container is serving its own health route: $body"; exit 0 ;;
            esac
            sleep 2
          done
          echo "::error::container never served /api/health"
          docker logs app
          exit 1

  # Deliberately separate and DB-backed. The unit tests are pure by design, but
  # a migration that fails to apply is a deploy-breaking bug that nothing else
  # in this pipeline would catch. Runs in parallel, so it costs no wall-clock.
  migrations:
    name: Migrations apply
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fintech_test
        ports:
          - 5432:5432
        # Without this the job races the container and fails intermittently on
        # "connection refused" — the classic flaky-CI cause.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fintech_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Uses the :ci variant because there is no .env.local here —
      # DATABASE_URL comes from the job env above.
      - name: Apply migrations
        run: npm run db:migrate:ci
