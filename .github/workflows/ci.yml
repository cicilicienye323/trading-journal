name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same PR cancels the previous run instead of queueing
# behind it. Keeps feedback fast and the free-tier minutes down.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fintech_test
        ports:
          - 5432:5432
        # Without this the job races the container and fails intermittently on
        # "connection refused" — the classic flaky-CI cause.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fintech_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` (not `npm install`) — installs exactly the lockfile and fails
      # if package.json and the lock have drifted apart.
      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Proves migrations actually apply to a real Postgres, rather than only
      # checking that the schema file parses. Uses the :ci variant because
      # there is no .env.local here — DATABASE_URL comes from the job env.
      - name: Apply migrations
        run: npm run db:migrate:ci

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # The build has no secrets injected; env validation runs for real at
          # server start instead.
          SKIP_ENV_VALIDATION: "true"

      - name: Verify committed fixtures are up to date
        run: |
          npm run fixtures
          git diff --exit-code fixtures/ \
            || (echo "::error::fixtures/ is stale — run 'npm run fixtures' and commit" && exit 1)
