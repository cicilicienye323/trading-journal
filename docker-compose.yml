# Local stack: app + Postgres.
#
# `docker compose up` gives anyone who clones the repo a running app and
# database in one command — no Node version juggling, no local Postgres install.
#
# Day-to-day development is still `npm run dev` against just the db service
# (`npm run db:up`), because the container has no hot reload.
services:
  db:
    image: postgres:16-alpine
    container_name: fintech_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fintech_dev
    ports:
      # 127.0.0.1 is load-bearing, not tidiness. "5432:5432" binds 0.0.0.0 —
      # every interface — and Docker writes its own iptables rules, so it goes
      # around ufw/firewalld without asking. On any machine with a public IP
      # that publishes a postgres/postgres database to the whole internet.
      #
      # This is not hypothetical: it happened to this project. The dev database
      # was wiped by an automated scanner that dropped every database and left
      # a "readme_to_recover" ransom note behind. Nothing of value was lost —
      # the only tables were scaffolding — but the same one line on a machine
      # holding real data is a very bad day.
      #
      # Bound to loopback, `npm run dev` and `npm run db:*` work exactly as
      # before. If you genuinely need to reach the database from another
      # machine, tunnel it: ssh -L 5432:localhost:5432 user@host
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fintech_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintech_app
    restart: unless-stopped
    depends_on:
      db:
        # Waits for the healthcheck above, not just for the container to exist.
        # Without this the app boots first and dies on connection refused.
        condition: service_healthy
    environment:
      # "db" is the compose service name — inside the network that resolves to
      # the database container. localhost here would point at the app itself.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/fintech_dev
      BETTER_AUTH_SECRET: local-development-only-secret-not-for-production
      BETTER_AUTH_URL: http://localhost:3000
      DEMO_EMAIL: demo@example.com
      # Optional: pass through from the host if set, empty otherwise.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      # Left on all interfaces deliberately: the point of this service is to
      # look at the app, sometimes from a phone or another machine on the LAN,
      # and it serves no data a signed-out visitor couldn't get from the
      # deployed site anyway. That is a different judgement from the database
      # above, which should never be reachable off-box.
      #
      # Running this on a public VPS? Use "127.0.0.1:3000:3000" here too.
      - "3000:3000"
    healthcheck:
      # 127.0.0.1, not localhost: /etc/hosts maps localhost to both 127.0.0.1
      # and ::1, busybox wget tries ::1 first, and the Next server binds IPv4
      # only — so "localhost" here fails with connection refused even though
      # the app is healthy.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  pgdata:
